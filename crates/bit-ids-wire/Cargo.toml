[package]
name = "bit-ids-wire"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bit-ids = { path = "../bit-ids" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# ⚠ No new package in the lockfile: `bit-ids-lab` already depends on `sha1` for
# the info hash `OBS-08` computes, so this moves nothing. `OBS-11`'s MSE key
# derivation is SHA-1 throughout, which the specification fixes.
sha1 = "0.11.0"

[dev-dependencies]
serde_json = "1.0.151"
