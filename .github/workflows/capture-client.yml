name: Capture client

# ⛔ THERE IS NO `pull_request` TRIGGER AND THAT ABSENCE IS THE FORK GUARD, for
# the reason capture.yml gives and more sharply. This workflow INSTALLS SOMEBODY
# ELSE'S BINARY on a runner and then points it at a network, so a path from a
# fork would be a path from a stranger to an install on this account's runners.
#
# ⛔ AND NO `push` OR `schedule` EITHER. A merge must not be able to start an
# install, and neither must a clock.
on:
  workflow_dispatch:
    inputs:
      adapters:
        description: >-
          Which adapters to run, as a JSON array, e.g. ["aria2","transmission"]
        required: true
        default: '["aria2","transmission","qbittorrent"]'
        type: string
      # ⛔ ONE ROUTE PER HOST, WHICH IS WHY THIS IS A MATRIX DIMENSION AND NOT A
      # SECOND INSTALL STEP. `ACQ-03` compares what two routes installed, and two
      # routes on one machine means the second installs over the first: the
      # digest comparison then has one host's final state to look at rather than
      # two independent acquisitions. A host per route is what makes the pair
      # comparable at all.
      #
      # ⚠ THE DEFAULT IS THE PACKAGE ROUTE ALONE, which is what every dispatch so
      # far ran. Adding `"release"` runs a second host per adapter; the pair is
      # then two artifacts to compare rather than one, and `TODO/acquisition.md`
      # carries what a comparison needs beyond two green jobs.
      routes:
        description: >-
          Which acquisition routes to run, as a JSON array, e.g. ["package","release"]
        required: true
        default: '["package"]'
        type: string
      seconds:
        description: How long the observer serves before its own deadline stops it
        required: true
        default: "45"
        type: string
      peer_port:
        description: The port the client is told to listen on, so the lab can dial it
        required: true
        default: "51413"
        type: string

permissions:
  contents: read

# ⛔ NEVER CANCELLED IN FLIGHT. Between *Cut the route* and *Restore the route*
# these hosts have no way off themselves, and a cancellation in that window
# leaves the runner unable to report, the evidence unuploaded and the marker
# written. ⚠ A separate group from capture.yml's, because these are different
# hosts running a different experiment and queueing one behind the other would
# serialise two things that never share a machine.
concurrency:
  group: capture-client
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux client capture (${{ matrix.adapter }}, ${{ matrix.route }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # ⛔ READ ONLY. A capture produces an artifact and never a commit.
    permissions:
      contents: read
    strategy:
      # ⛔ ONE ADAPTER'S FAILURE MUST NOT CANCEL THE OTHERS. Each job is a
      # separate host running a separate product, and a matrix that stopped at
      # the first red would throw away measurements that had already been taken
      # on machines that are about to be destroyed.
      fail-fast: false
      # ⛔ THE CROSS PRODUCT IS THE POINT, NOT AN ACCIDENT OF THE SHAPE. Every
      # (adapter, route) pair is a separate host that acquires one target through
      # one route, which is the design `install-client` already enforces by
      # taking one `--route` per call. ⚠ A route a target cannot satisfy fails
      # its own job and leaves every other job's measurement intact - which is
      # what `fail-fast: false` above is for, and is the honest state for
      # transmission's release route today.
      matrix:
        adapter: ${{ fromJSON(inputs.adapters) }}
        route: ${{ fromJSON(inputs.routes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⛔ FIRST, BEFORE ANYTHING ELSE WRITES TO THE HOST, and before anything is
      # installed. The claim refuses a host that already ran a capture, and a
      # product installed before the claim would be state on a machine nothing
      # had established was disposable.
      - name: Claim the host
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-${{ matrix.route }}
        run: sudo sh scripts/acquisition/assert-disposable.sh --claim "$RUN_ID"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      # ⛔ THE BUILD HAPPENS HERE, WHILE THE NETWORK STILL EXISTS - and that is
      # every binary this job will run, not only the observer. `resolve-release`
      # refuses rather than building, for the reason `capture-run` does: a step
      # that discovered a missing dependency later would have to reach a crate
      # registry from a host whose route is about to be cut.
      #
      # ⚠ Both resolver examples are built on the package lane too, which costs
      # seconds and keeps this step's command free of a condition. A build that
      # sometimes ran is a build whose absence is a matrix leg nobody reads.
      - name: Build the observer
        run: |
          set -eu
          cargo build -p bit-ids-probe --locked --example client-capture
          cargo build -p bit-ids --locked --example resolve-stable --example select-asset

      # ⛔ AND SO DOES THE INSTALL, FOR THE SAME REASON AND ONE MORE. capture-client
      # refuses to install anything, so a product that is not here by now is not
      # in this capture; and an install under containment could not reach a
      # package index at all.
      #
      # ⚠ sudo -E, because apt needs root and the adapter reads its
      # configuration out of the environment. The install directory is under
      # RUNNER_TEMP rather than the workspace, so nothing it leaves behind can
      # be mistaken for a tracked file.
      # ⛔ AND THE ARTIFACT IS CHOSEN BEFORE THE ROUTE IS CUT, WHICH IS WHY THIS
      # STEP EXISTS AT ALL. Every `release` route in this tree refuses without
      # `BIT_IDS_RELEASE_URL`, and until now nothing produced one: `resolve-stable`
      # orders versions and does not select an artifact. `resolve-release` reads
      # the repository, the version scheme and the asset pattern out of the
      # adapter's own `describe`, so this step carries no per-target knowledge and
      # needs no case over `matrix.adapter`.
      #
      # ⚠ THE PACKAGE LANE SKIPS IT because a package index needs no artifact
      # chosen, and a step that ran anyway would fetch a vendor listing that
      # nothing in that lane reads.
      # ⭐ AND THE SOURCE LANE RESOLVES THROUGH THE SAME STEP, because both
      # routes must land on ONE stable version. The release lane reads the asset
      # URL out of the resolution and the source lane reads the tag; a second
      # resolution per lane would let a vendor whose newest release moves between
      # two reads hand the two routes different versions, which is exactly what
      # absolute 4 forbids.
      - name: Resolve the release artifact
        if: matrix.route == 'release' || matrix.route == 'source'
        env:
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
        run: |
          set -eu
          # ⛔ THE DIRECTORY IS MADE BEFORE THE REDIRECTION, NOT BY THE SCRIPT.
          # A shell opens `>` targets before it execs the command, so a workdir
          # created inside `resolve-release` is created too late for a redirect
          # into it and the step dies on the redirection rather than on anything
          # the script did.
          mkdir -p "$RUNNER_TEMP/release"
          sh scripts/acquisition/resolve-release.sh \
            --adapter "$ADAPTER" \
            --workdir "$RUNNER_TEMP/release" \
            --record "$RUNNER_TEMP/release/resolution.txt" \
            >"$RUNNER_TEMP/release/url.txt"
          cat "$RUNNER_TEMP/release/resolution.txt"

      # ⛔ THREE BOUNDED PROBES, AND THEIR ONLY PURPOSE IS THEIR NAMES. Four
      # independent bounds have now been measured NOT to end an aria2 install
      # step - `timeout` inside `install-client`, the runner's `timeout-minutes`,
      # a watchdog loop in the step's own shell, and `timeout` around the step's
      # own process - and no such job has ever produced a log or an artifact.
      # When nothing inside a job survives, the one signal that does is WHICH
      # STEP the API last reported in progress.
      #
      # ⭐ So the work the install step does first is split into steps of its own,
      # each named and each bounded. A job that wedges in one of these localises
      # the subject to a handful of commands without needing a log, an artifact or
      # a bound that fires; a job that walks through all three has exonerated them
      # and the install itself is the subject.
      #
      # ⚠ THEY ARE DIAGNOSTIC AND THEY DO NOT GUARD ANYTHING. Each ends in a true
      # so that a probe cannot fail a capture, and `CI-08` owns them - they come
      # out when the question is answered.
      - name: Probe the host resources
        run: |
          set -u
          timeout 20 free -m || echo 'free did not answer'
          timeout 20 df -h / "$RUNNER_TEMP" || echo 'df did not answer'
          timeout 20 nproc || echo 'nproc did not answer'
          true

      - name: Probe sudo
        run: |
          set -u
          timeout 20 sudo -n true && echo 'sudo answers' || echo 'sudo did not answer'
          timeout 20 sudo -n -E sh -c 'echo sudo runs a shell' || echo 'sudo -E did not answer'
          true

      # ⚠ THE ONE COMMAND THE aria2 LANES RUN AND THE TRANSMISSION LANES DO NOT.
      # `install-client` asks the adapter for a version BEFORE the route runs, and
      # `aria2` ships on this image while `transmission-daemon` does not - so on an
      # aria2 lane that call executes the preinstalled product and on a
      # transmission lane it finds no binary and refuses without running anything.
      # That asymmetry has been in every hung run and in none of the green ones.
      - name: Probe the preinstalled product
        env:
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
        run: |
          set -u
          timeout 30 sh "$ADAPTER" describe || echo 'describe did not answer'
          timeout 30 sh "$ADAPTER" version || echo 'version did not answer or is not installed'
          true

      # ⛔ THE WORK IS IN A FILE SO THE STEP'S OWN PROCESS CAN BE BOUNDED. That is
      # the one place a bound has not been tried here, and every other place has
      # been measured failing: `install-step.sh` says which and why.
      #
      # ⛔ AND NOTHING THE ROUTE SPAWNS INHERITS THIS STEP'S OUTPUT. A runner ends
      # a `run:` step when the command has exited AND the step's output pipe has
      # reached end of file, so a single process the product leaves behind holding
      # that pipe keeps the step open with an exit code of 0 sitting in it.
      # `scripts/ci/check-step-bodies.sh` runs this step's body and measures both
      # halves of that.
      - name: Install the client
        env:
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
          ROUTE: ${{ matrix.route }}
          # ⭐ THE INNER BOUND IS RAISED FOR A SOURCE BUILD AND ONLY FOR ONE.
          # `install-client` bounds the adapter call at 420 seconds by default,
          # and `aria2-next`'s source route was measured at 366 - fifty-four
          # seconds of margin, which a slower runner spends. ⚠ 500 keeps it UNDER
          # the step's own 540, so a build that overruns is refused by
          # `install-client` with a message naming the timeout rather than killed
          # by the outer bound with nothing to read.
          # ⛔ Every other route keeps 420 exactly: the aria2 lanes are what that
          # number was measured against, and this must not quietly move it.
          BIT_IDS_INSTALL_TIMEOUT: ${{ matrix.route == 'source' && '500' || '420' }}
        # ⛔ THE BOUND IS ON THE STEP'S OWN PROCESS, WHICH IS THE ONE PLACE IT HAS
        # NOT BEEN TRIED. `timeout` inside `install-client` ends its own child and
        # cannot end a shell blocked around it; `timeout-minutes` is the runner's
        # and was measured on run 6 not to end the step; and a watchdog loop in
        # the step's own shell was measured on run 9 not to fire, its deadline
        # passing by three minutes. This one needs nothing inside the step to be
        # reachable.
        #
        # ⚠ 540 SECONDS, UNDER THE JOB'S 25 MINUTES WITH ROOM FOR THE CAPTURE AND
        # THE UPLOADS. What it buys is not a faster failure: it is a job that
        # reaches its uploads at all, because a runner that is killed leaves no
        # log and no artifact - measured on runs 7, 8 and 9.
        run: timeout -k 30 540 sh scripts/acquisition/install-step.sh
        # ⚠ The body this replaced is in that file, unchanged in what it does.

      # ⛔ BOTH ADDRESS FAMILIES. A host with IPv4 unplugged and IPv6 up still
      # reaches the internet.
      - name: Cut the route off this host
        run: |
          set -eu
          ip route show default >"$RUNNER_TEMP/routes-v4"
          ip -6 route show default >"$RUNNER_TEMP/routes-v6" 2>/dev/null || : >"$RUNNER_TEMP/routes-v6"
          while ip route show default | grep -q .; do sudo ip route del default; done
          while ip -6 route show default 2>/dev/null | grep -q .; do sudo ip -6 route del default; done
          printf 'saved %s v4 and %s v6 default route(s)\n' \
            "$(wc -l <"$RUNNER_TEMP/routes-v4")" "$(wc -l <"$RUNNER_TEMP/routes-v6")"

      # ⛔ THE GUARD READS THE KERNEL RATHER THAN THE STEP ABOVE. The deletion is
      # a command that was run; this is the routing table as it now stands.
      - name: Assert containment
        run: sh scripts/acquisition/assert-disposable.sh --egress

      # ⭐ AND HERE A PRODUCT THIS PROJECT DID NOT WRITE IS HANDED THE TORRENT.
      # It learns the tracker's address by reading the file, which is what a
      # stock build does with any torrent, so nothing about this run is a control
      # the product does not already have.
      - name: Capture
        env:
          RUN_ID: capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adapter }}-${{ matrix.route }}
          SECONDS_TO_SERVE: ${{ inputs.seconds }}
          PEER_PORT: ${{ inputs.peer_port }}
          ADAPTER: scripts/capture/adapters/${{ matrix.adapter }}.sh
        run: |
          sh scripts/capture/capture-client.sh \
            --run-id "$RUN_ID" \
            --out "$RUNNER_TEMP/capture" \
            --observer "$GITHUB_WORKSPACE/target/debug/examples/client-capture" \
            --adapter "$ADAPTER" \
            --peer-port "$PEER_PORT" \
            --seconds "$SECONDS_TO_SERVE"

      # ⚠ ONLY TO UPLOAD, AND ONLY AFTER THE MEASUREMENT IS FINISHED.
      #
      # ⭐ THE RESTORE IS VERIFIED BY THE SAME GUARD, INVERTED: a host that can
      # reach the network again is one the egress guard REFUSES.
      - name: Restore the route
        run: |
          set -eu
          # ⛔ AN ADD THAT FAILS IS REPORTED AND DOES NOT END THE STEP. Under
          # set -e the first refused `ip route add` would end this step, the
          # upload would be skipped as a consequence, and a finished capture
          # would be thrown away over a route.
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            # shellcheck disable=SC2086
            sudo ip route add $route || echo "could not restore: $route" >&2
          done <"$RUNNER_TEMP/routes-v4"
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            # shellcheck disable=SC2086
            sudo ip -6 route add $route || echo "could not restore: $route" >&2
          done <"$RUNNER_TEMP/routes-v6"
          # ⛔ THE GUARD HAS THREE CODES AND THIS READS ALL THREE. ⚠ An `if`
          # would fold 1 and 2 together and upload from a host nothing
          # established was reachable.
          sh scripts/acquisition/assert-disposable.sh --egress && egress=0 || egress=$?
          if [ "$egress" = 0 ]; then
            echo 'the default route was not restored; the upload cannot work' >&2
            exit 1
          fi
          if [ "$egress" != 1 ]; then
            echo "the egress guard could not run (exit $egress)" >&2
            exit 1
          fi
          exit 0

      # ⛔ if-no-files-found IS `error`. An upload that found nothing and exited
      # 0 would leave a green capture run with no evidence anywhere.
      #
      # ⚠ The install record goes up beside the bundle, because `ACQ-03` compares
      # what each route's installed build REPORTED and that answer lives there.
      - name: Upload the evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-client-${{ matrix.adapter }}-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/capture
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
          if-no-files-found: error
          retention-days: 90

      # ⛔ THE INSTALL'S OWN LOGS GO UP WHETHER OR NOT ANYTHING BEFORE THIS
      # WORKED, and `if: always()` is what makes that true from here rather than
      # from before the capture. It sat between the install and the route cut for
      # four dispatches, on the reasoning that a job which never reached the
      # capture would otherwise upload nothing - and an `always()` step at the end
      # of the job runs after a failed step too, so the early position bought
      # nothing that this one does not.
      #
      # ⛔ WHAT IT COST WAS EVERY aria2 CAPTURE. That step has hung on every aria2
      # job since run 3, *after* completing its upload: on run 6 the package
      # lane's artifact was written one second in and the step had not returned
      # seventeen minutes later. From here a hang costs the job's tail rather than
      # the measurement, because the capture and the evidence upload have already
      # happened.
      #
      # ⚠ A BOUND WAS TRIED AND IT DOES NOT FIRE. `timeout-minutes: 5` on this
      # step was measured on run 6 against a step that ran seventeen minutes, so
      # it is not kept: a bound that has been seen not to bound the one failure it
      # was added for is decoration. `CI-08` owns the cause.
      #
      # ⛔ AND IT MUST COME AFTER *Restore the route*, like every other upload:
      # between the cut and the restore this host has no way off itself, so an
      # upload there could not reach GitHub at all.
      #
      # ⚠ if-no-files-found is `warn` rather than `error`: a job that failed
      # before the workdir existed has nothing to upload, and failing this step
      # would replace one missing diagnosis with another. ⛔ `continue-on-error`
      # is deliberate here and nowhere else - this upload is a diagnostic aid and
      # the evidence bundle above stays fatal.
      #
      # ⛔ LOGS AND RECORDS, NAMED, RATHER THAN THE WHOLE WORKDIR. A source-build
      # route unpacks a tarball and compiles it *in* that workdir, so uploading
      # the directory uploads a build tree: measured on run 5, 42.6 megabytes and
      # 1867 entries for a step called *Upload the install logs*. ⚠ The package
      # route's workdir happens to hold two log files, which is why the directory
      # form looked right for four dispatches.
      - name: Upload the install logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-${{ matrix.adapter }}-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/install-${{ matrix.route }}/*.log
            ${{ runner.temp }}/install-${{ matrix.route }}/*.err
            ${{ runner.temp }}/install-${{ matrix.route }}.txt
            ${{ runner.temp }}/release/*.txt
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/release/*.err
          if-no-files-found: warn
          retention-days: 30

      # ⚠ A FINGERPRINT IS COMPARABLE ONLY AGAINST ONE THE SAME HALF PRODUCED,
      # and on Linux a repeat really does mean a survived host.
      - name: Report the host fingerprint
        if: always()
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          set -eu
          print=$(sh scripts/acquisition/assert-disposable.sh --fingerprint)
          echo "linux host fingerprint: $print"
          {
            echo "### ${{ matrix.adapter }} (${{ matrix.route }})"
            echo
            echo "host fingerprint \`$print\`"
            echo
            echo 'Compare against the previous **Linux** run. A repeat means the host was not destroyed.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/release/resolution.txt" 2>/dev/null || echo 'no release resolution'
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/install-$ROUTE.txt" 2>/dev/null || echo 'no install record'
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/capture/attestation.txt" 2>/dev/null || echo 'no attestation'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
